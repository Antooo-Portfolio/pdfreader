[package]
name = "pdfreader-desktop"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
pdfreader-engine = { path = "../../../crates/engine" }
pdfium-render = { version = "0.9.5", default-features = false, features = ["thread_safe", "pdfium_latest"] }
serde_json = "1"
anyhow = "1"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
rusqlite = { version = "0.41.1", features = ["bundled"] }
tokio = { version = "1.54.1", features = ["sync"] }
serde = { version = "1.0.229", features = ["derive"] }
uuid = { version = "1.29.2", features = ["v4"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
