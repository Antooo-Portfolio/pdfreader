[workspace]
resolver = "3"
members = ["crates/engine", "apps/desktop/src-tauri"]

[workspace.package]
edition = "2024"
license = "LicenseRef-Proprietary"
publish = false

[profile.release]
debug = 1

# Copie locale de pdfium-render 0.9.5 (MIT OR Apache-2.0) avec un correctif :
# PdfDocument::save_to_writer_with_flags (sauvegarde incrémentale). Voir vendor/README.md.
[patch.crates-io]
pdfium-render = { path = "vendor/pdfium-render" }
