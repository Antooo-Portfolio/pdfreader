[package]
name = "pdfreader-engine"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
image = { version = "0.25.10", default-features = false, features = ["png", "webp"] }
memory-stats = "1.2.0"
pdfium-render = { version = "0.9.5", default-features = false, features = ["thread_safe", "pdfium_latest", "pdfium_use_win32"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Printing", "Win32_Storage_Xps"] }
