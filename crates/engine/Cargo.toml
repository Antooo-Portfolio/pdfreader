[package]
name = "pdfreader-engine"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
image = { version = "0.25.10", default-features = false, features = ["png", "webp", "jpeg", "bmp", "gif", "tiff"] }
lopdf = { version = "0.47.0", default-features = false }
getrandom = "0.4"
memory-stats = "1.2.0"
pdfium-render = { version = "0.9.5", default-features = false, features = ["thread_safe", "pdfium_latest", "pdfium_use_win32"] }
rquickjs = { version = "0.14.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = ["Foundation", "Foundation_Collections", "Globalization", "Graphics_Imaging", "Media_Ocr", "Security_Cryptography", "Storage_Streams", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Printing", "Win32_Storage_Xps", "Win32_System_Com", "Win32_System_WinRT"] }
