# Contrôle des licences (code fermé) : seules les licences permissives sont acceptées.
# Interdit : GPL, AGPL, LGPL (liaison statique). Voir replica/architecture.md, « Licences tierces ».
[graph]
targets = ["x86_64-pc-windows-msvc"]
all-features = false

[licenses]
allow = [
  "MIT", "MIT-0", "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "0BSD",
  "Unicode-3.0", "Unicode-DFS-2016", "CC0-1.0", "BSL-1.0", "MPL-2.0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
# Nos propres crates (code fermé).
[[licenses.exceptions]]
allow = ["LicenseRef-Proprietary"]
crate = "pdfreader-engine"
[[licenses.exceptions]]
allow = ["LicenseRef-Proprietary"]
crate = "pdfreader-desktop"

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"

[advisories]
ignore = []
